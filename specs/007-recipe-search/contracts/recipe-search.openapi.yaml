openapi: 3.1.0
info:
  title: Recipeapp Recipe Search API
  version: 1.0.0
paths:
  /api/recipes:
    get:
      summary: List saved recipes matching optional keyword and filters
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive keyword or phrase across title, ingredients, tags, cuisine, and category.
        - in: query
          name: favorite
          schema: { type: boolean }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: ingredient
          schema: { type: string }
        - in: query
          name: cuisine
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
      responses:
        '200':
          description: Matching saved recipe summaries ordered by most recently updated first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, title, favorite]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    favorite: { type: boolean }
                    prepMinutes: { type: integer }
                    cookMinutes: { type: integer }
                    category: { type: string }
                    updatedAt: { type: string, format: date-time }
        '400':
          description: An invalid filter value was supplied.
