openapi: 3.1.0
info:
  title: Recipe Library Foundation API
  version: 1.0.0
  description: Non-sensitive service availability contract for Feature 001.
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check whether the Recipe Library service is available.
      responses:
        '200':
          description: The service and its required platform bindings are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                available:
                  value:
                    status: ok
        '503':
          description: The service is temporarily unavailable or required configuration is absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unavailable:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Service is temporarily unavailable.
                      retryable: true
    post:
      operationId: rejectHealthPost
      summary: Reject unsupported methods without exposing implementation details.
      responses:
        '405':
          description: The method is not supported.
          headers:
            Allow:
              schema:
                type: string
                const: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              enum:
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - SERVICE_UNAVAILABLE
            message:
              type: string
            retryable:
              type: boolean
